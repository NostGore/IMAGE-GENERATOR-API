<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMG API - Generador de Imágenes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        header p {
            color: #888;
            font-size: 1rem;
        }

        .input-section {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        #prompt-input {
            flex: 1;
            padding: 16px 20px;
            font-size: 1rem;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            color: #fff;
            outline: none;
            transition: border-color 0.3s ease;
        }

        #prompt-input:focus {
            border-color: #667eea;
        }

        #prompt-input::placeholder {
            color: #666;
        }

        #generate-btn {
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            white-space: nowrap;
        }

        #generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        #generate-btn:active {
            transform: translateY(0);
        }

        #generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-section {
            width: 100%;
            min-height: 300px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .result-section img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 8px;
            display: none;
        }

        .result-section img.visible {
            display: block;
        }

        .placeholder {
            color: #555;
            font-size: 1rem;
            text-align: center;
            padding: 20px;
        }

        .placeholder.hidden {
            display: none;
        }

        .loading {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .loading.visible {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            display: none;
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
        }

        .error-message.visible {
            display: block;
        }

        .actions {
            display: none;
            gap: 12px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .actions.visible {
            display: flex;
        }

        .action-btn {
            padding: 12px 24px;
            font-size: 0.9rem;
            font-weight: 500;
            background: #1a1a1a;
            color: #e0e0e0;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            border-color: #667eea;
            background: #222;
        }

        .api-info {
            margin-top: 40px;
            padding: 20px;
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            width: 100%;
        }

        .api-info h3 {
            color: #667eea;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .api-info code {
            display: block;
            background: #0a0a0a;
            padding: 12px 16px;
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            color: #a8d8a8;
            overflow-x: auto;
            white-space: pre;
        }

        @media (max-width: 600px) {
            .input-section {
                flex-direction: column;
            }

            #generate-btn {
                width: 100%;
            }

            header h1 {
                font-size: 1.8rem;
            }

            .result-section {
                min-height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>IMG API</h1>
            <p>Genera imágenes con IA desde texto</p>
        </header>

        <div class="input-section">
            <input 
                type="text" 
                id="prompt-input" 
                placeholder="Describe la imagen que quieres generar..."
                autocomplete="off"
            >
            <button id="generate-btn">Generar</button>
        </div>

        <div class="result-section" id="result-section">
            <div class="placeholder" id="placeholder">Escribe un prompt y haz clic en Generar</div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <span>Generando imagen...</span>
            </div>
            <div class="error-message" id="error-message"></div>
            <img id="result-image" alt="Imagen generada">
        </div>

        <div class="actions" id="actions">
            <button class="action-btn" id="download-btn">Descargar</button>
            <button class="action-btn" id="copy-btn">Copiar Base64</button>
            <button class="action-btn" id="new-btn">Nueva imagen</button>
        </div>

        <div class="api-info">
            <h3>Uso de la API</h3>
            <code>GET /api/generate?prompt=tu+prompt+aqui</code>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8001/api/generate';

        const promptInput = document.getElementById('prompt-input');
        const generateBtn = document.getElementById('generate-btn');
        const resultSection = document.getElementById('result-section');
        const placeholder = document.getElementById('placeholder');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('error-message');
        const resultImage = document.getElementById('result-image');
        const actions = document.getElementById('actions');
        const downloadBtn = document.getElementById('download-btn');
        const copyBtn = document.getElementById('copy-btn');
        const newBtn = document.getElementById('new-btn');

        let currentImageBase64 = '';

        function showState(state) {
            placeholder.classList.add('hidden');
            loading.classList.remove('visible');
            errorMessage.classList.remove('visible');
            resultImage.classList.remove('visible');
            actions.classList.remove('visible');

            switch(state) {
                case 'loading':
                    loading.classList.add('visible');
                    break;
                case 'error':
                    errorMessage.classList.add('visible');
                    break;
                case 'result':
                    resultImage.classList.add('visible');
                    actions.classList.add('visible');
                    break;
                case 'idle':
                    placeholder.classList.remove('hidden');
                    break;
            }
        }

        async function generateImage() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            showState('loading');
            generateBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}?prompt=${encodeURIComponent(prompt)}`);
                
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'Error al generar la imagen');
                }

                currentImageBase64 = data.image;
                resultImage.src = `data:image/png;base64,${data.image}`;
                showState('result');
            } catch (error) {
                errorMessage.textContent = error.message;
                showState('error');
            } finally {
                generateBtn.disabled = false;
            }
        }

        generateBtn.addEventListener('click', generateImage);

        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                generateImage();
            }
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.href = `data:image/png;base64,${currentImageBase64}`;
            link.download = `imagen-${Date.now()}.png`;
            link.click();
        });

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(currentImageBase64);
                copyBtn.textContent = 'Copiado!';
                setTimeout(() => {
                    copyBtn.textContent = 'Copiar Base64';
                }, 2000);
            } catch {
                copyBtn.textContent = 'Error';
                setTimeout(() => {
                    copyBtn.textContent = 'Copiar Base64';
                }, 2000);
            }
        });

        newBtn.addEventListener('click', () => {
            promptInput.value = '';
            promptInput.focus();
            showState('idle');
            currentImageBase64 = '';
        });
    </script>
</body>
</html>
